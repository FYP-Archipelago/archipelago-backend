[project]
name = "archipelago-backend"
version = "0.2.0"
description = "Backend for Archipelago: explainability platform for island-model distributed Evolutionary Algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "archipelago", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27",
  "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "redis>=5.0",
]

[dependency-groups]
dev = ["pre-commit", "pytest>=9.1", "ruff==0.17.2"]

[tool.uv]
package = false

[tool.uv.sources]
archipelago = { git = "https://github.com/FYP-Archipelago/archipelago" }

[tool.ruff]
line-length = 150

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
