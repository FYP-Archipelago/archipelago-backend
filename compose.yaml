services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archipelago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: archipelago
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archipelago"]
      interval: 2s
      retries: 15
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes",
              "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 2s
      retries: 15
  drizzle:
    image: ghcr.io/drizzle-team/gateway:latest
    environment:
      PORT: 4983
      STORE_PATH: /app
      MASTERPASS: ${DRIZZLE_MASTERPASS:?}
    volumes: [drizzle:/app]
    ports: ["127.0.0.1:4983:4983"]
  redisinsight:
    image: redis/redisinsight:latest
    volumes: [redisinsight:/data]
    ports: ["127.0.0.1:5540:5540"]
  api:
    build: .
    environment:
      ARCHIPELAGO_DATABASE_URL: postgresql://archipelago:${POSTGRES_PASSWORD}@db:5432/archipelago
      ARCHIPELAGO_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARCHIPELAGO_RUNNER_URL: ${ARCHIPELAGO_RUNNER_URL:?}
      ARCHIPELAGO_CORS_ORIGINS: ${ARCHIPELAGO_CORS_ORIGINS:-*}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      ARCHIPELAGO_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    deploy: {replicas: 2}
    restart: unless-stopped
volumes:
  pgdata: {}
  redisdata: {}
  drizzle: {}
  redisinsight: {}
