services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archipelago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: archipelago
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archipelago"]
      interval: 2s
      retries: 15
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes",
              "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 2s
      retries: 15
  drizzle:
    image: ghcr.io/drizzle-team/gateway:latest
    environment:
      PORT: 4983
      STORE_PATH: /app
      MASTERPASS: ${DRIZZLE_MASTERPASS:?}
    volumes: [drizzle:/app]
    ports: ["4983:4983"]
  redisinsight:
    image: redis/redisinsight:latest
    volumes: [redisinsight:/data]
    ports: ["5540:5540"]
volumes:
  pgdata: {}
  redisdata: {}
  drizzle: {}
  redisinsight: {}
