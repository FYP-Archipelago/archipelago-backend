info:
  name: Run Event Stream
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/runs/{{run_id}}/events"
  headers:
    - name: Accept
      value: text/event-stream
    - name: Last-Event-ID
      value: "{{last_event_id}}"
      disabled: true

runtime:
  scripts:
    - type: before-request
      code: req.setTimeout(0);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
