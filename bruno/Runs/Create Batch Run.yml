info:
  name: Create Batch Run
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/runs"
  headers:
    - name: Origin
      value: "{{origin}}"
    - name: X-CSRF-Token
      value: "{{csrf_token}}"
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "preset": "ga_tsp",
        "overrides": {
          "num_islands": 4,
          "evaluation_budget": 200000,
          "target_generations": 60,
          "migration.enabled": false,
          "seed": 7
        },
        "stream": false,
        "clustering": {"lsh": true, "birch": true, "denstream": true, "seed": 7}
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 202) {
          bru.setVar("run_id", res.getBody().run_id);
          console.log("run_id:", res.getBody().run_id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
