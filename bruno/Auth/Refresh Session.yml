info:
  name: Refresh Session
  type: http
  seq: 15

http:
  method: POST
  url: "{{base_url}}/auth/refresh"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: "{}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
