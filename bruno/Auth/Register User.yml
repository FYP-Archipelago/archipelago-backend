info:
  name: Register User
  type: http
  seq: 12

http:
  method: POST
  url: "{{base_url}}/auth/register"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "email": "researcher@example.com",
        "password_digest": "2770663171cf96af58bbfd80fc8c1b51e43a1865cd489ea8504718d978d9165f",
        "full_name": "Test Researcher",
        "institution": "Test Organization"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
